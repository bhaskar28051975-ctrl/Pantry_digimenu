<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>pantry digital menu</title>
<meta name="theme-color" content="#dc2626"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
<style>
.dish-card{transition:transform 0.15s;position:relative}.dish-card:active{transform:scale(0.97)}
.oos-overlay{position:absolute;inset:0;border-radius:1rem;background:rgba(0,0,0,0.52);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;z-index:10;pointer-events:none;backdrop-filter:blur(2px)}
.oos-badge{background:#dc2626;color:#fff;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:99px}
</style>
</head>
<body class="bg-gray-100 text-gray-800" style="padding-bottom:100px">

<header class="bg-white p-4 shadow-sm sticky top-0 z-50 flex justify-between items-center border-b-4 border-red-600 gap-2">
  <div class="flex flex-col min-w-0">
    <h1 class="text-2xl font-black text-red-600 italic uppercase leading-none">Pantry Digital Menu</h1>
    <p class="text-xs font-semibold text-slate-600 mt-1">Order Food Directly To Your Seat</p>
  </div>
  <button onclick="location.reload()" class="text-[10px] font-bold bg-gray-100 px-3 py-2 rounded-full uppercase">Refresh</button>
</header>

<div id="customer-list" class="p-4 space-y-8">
  <div class="flex flex-col items-center justify-center py-16 gap-4">
    <div class="w-12 h-12 border-4 border-red-500 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-sm font-black text-gray-400 uppercase tracking-widest">Loading Menu…</p>
  </div>
</div>

<div id="bottom-bill-bar" class="hidden fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_20px_rgba(0,0,0,0.1)] p-4 z-[90] flex justify-between items-center border-t border-gray-200">
  <div>
    <p class="text-[10px] font-black text-gray-400 uppercase">Total Bill</p>
    <p id="panel-total" class="text-2xl font-black text-green-600">₹0</p>
  </div>
  <div class="flex items-center gap-3">
    <button id="cancelBtn" class="text-red-500 font-bold text-xs uppercase bg-red-50 px-4 py-3 rounded-xl active:scale-95">Clear</button>
    <button id="proceedBtn" class="bg-red-600 text-white px-6 py-3 rounded-xl font-black text-sm uppercase shadow-md active:scale-95 flex items-center gap-2">Proceed <i class="fas fa-arrow-right text-xs"></i></button>
  </div>
</div>

<div id="checkout-modal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
  <div class="bg-white w-full max-w-md rounded-t-[2.5rem] sm:rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-5 border-b pb-3">
      <h3 class="text-lg font-black text-gray-800 uppercase italic">Seat & Passenger Details</h3>
      <button id="closeModalBtn" class="text-gray-400 p-2"><i class="fas fa-times text-xl"></i></button>
    </div>
    <div class="space-y-4">
      <input id="custName" type="text" placeholder="Passenger Name *" class="w-full p-4 border border-gray-200 rounded-2xl bg-gray-50 font-bold text-sm focus:outline-none focus:border-red-400"/>
      <input id="custPhone" type="tel" placeholder="Mobile Number *" class="w-full p-4 border border-gray-200 rounded-2xl bg-gray-50 font-bold text-sm focus:outline-none focus:border-red-400"/>
      
      <div class="grid grid-cols-2 gap-3">
        <input id="coachNo" type="text" placeholder="Coach No. (e.g., B4) *" class="p-4 border border-gray-200 rounded-2xl bg-gray-50 font-bold text-sm uppercase focus:outline-none focus:border-red-400"/>
        <input id="seatNo" type="text" placeholder="Seat No. (e.g., 42) *" class="p-4 border border-gray-200 rounded-2xl bg-gray-50 font-bold text-sm uppercase focus:outline-none focus:border-red-400"/>
      </div>

      <div class="bg-orange-50 border border-orange-200 rounded-2xl p-4 flex items-center gap-3">
        <div class="w-12 h-12 bg-orange-100 rounded-xl flex items-center justify-center text-2xl shrink-0">💵</div>
        <div>
          <p class="font-black text-gray-800 text-sm">Cash on Delivery / On Seat</p>
          <p class="text-xs text-gray-500 mt-0.5">Pay cash when food is served to your seat.</p>
        </div>
      </div>

      <div class="pt-1">
        <div class="flex justify-between items-center mb-3 px-1">
          <span class="text-gray-500 font-bold text-sm">Grand Total:</span>
          <span id="modal-total" class="text-2xl font-black text-green-600">₹0</span>
        </div>
        <button id="placeOrderBtn" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg active:scale-95 text-base">🍱 Confirm Order</button>
      </div>
    </div>
  </div>
</div>

<div id="success-modal" class="hidden fixed inset-0 bg-black/60 z-[120] flex items-center justify-center p-6 backdrop-blur-sm">
  <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-4">
    <div class="text-6xl">🍱</div>
    <h2 class="text-2xl font-black text-gray-800">Order Placed!</h2>
    <p class="text-gray-500 text-sm font-bold" id="successMsg"></p>
    <button id="successDoneBtn" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg active:scale-95 text-sm">Done 👍</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Your Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyA2Dw4lWoDUpCZgvIH4CDGdya_VlHMKHbw",
    authDomain: "pantry-digimenu.firebaseapp.com",
    databaseURL: "https://pantry-digimenu-default-rtdb.firebaseio.com",
    projectId: "pantry-digimenu",
    storageBucket: "pantry-digimenu.firebasestorage.app",
    messagingSenderId: "302806127330",
    appId: "1:302806127330:web:257d91f88c1639788504bb",
    measurementId: "G-ZL7B7N55D7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let cart = {};

  // DOM Elements
  const checkoutModal = document.getElementById('checkout-modal');
  const successModal = document.getElementById('success-modal');

  document.getElementById('proceedBtn').addEventListener('click', () => checkoutModal.classList.remove('hidden'));
  document.getElementById('closeModalBtn').addEventListener('click', () => checkoutModal.classList.add('hidden'));
  document.getElementById('cancelBtn').addEventListener('click', () => { cart = {}; updateUI(); });
  document.getElementById('successDoneBtn').addEventListener('click', () => { successModal.classList.add('hidden'); location.reload(); });

  // Place Order
  document.getElementById('placeOrderBtn').addEventListener('click', () => {
    const name = document.getElementById('custName').value.trim();
    const phone = document.getElementById('custPhone').value.trim();
    const coach = document.getElementById('coachNo').value.trim();
    const seat = document.getElementById('seatNo').value.trim();

    if (!name || !phone || !coach || !seat) {
      alert('Please fill in all details including Coach and Seat numbers!');
      return;
    }

    const orderRef = push(ref(db, 'orders'));
    const orderData = {
      customerName: name,
      customerPhone: phone,
      deliveryAddress: `Coach: ${coach.toUpperCase()}, Seat: ${seat.toUpperCase()}`,
      items: Object.values(cart).map(i => `${i.name} x${i.qty}`).join(', '),
      totalAmount: calculateTotal(),
      status: 'pending',
      createdAt: Date.now()
    };

    set(orderRef, orderData).then(() => {
      checkoutModal.classList.add('hidden');
      document.getElementById('successMsg').textContent = `Order sent! Will be delivered to Coach ${coach.toUpperCase()}, Seat ${seat.toUpperCase()}`;
      successModal.classList.remove('hidden');
    });
  });

  function calculateTotal() {
    return Object.values(cart).reduce((sum, item) => sum + (item.price * item.qty), 0);
  }

  function updateUI() {
    const total = calculateTotal();
    document.getElementById('panel-total').textContent = `₹${total}`;
    document.getElementById('modal-total').textContent = `₹${total}`;
    if (total > 0) {
      document.getElementById('bottom-bill-bar').classList.remove('hidden');
    } else {
      document.getElementById('bottom-bill-bar').classList.add('hidden');
    }
  }
</script>
</body>
</html>
