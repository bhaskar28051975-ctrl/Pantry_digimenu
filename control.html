<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantry Digital Menu - Master Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-md space-y-8">
        <div class="text-center">
            <h1 class="text-3xl font-black italic tracking-tighter uppercase text-red-500">Pantry <span class="text-white not-italic">Digital Menu</span></h1>
            <p class="text-gray-400 text-[10px] font-bold uppercase tracking-[0.4em] mt-2">Train Service Command Center</p>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <a href="admin.html" class="bg-gray-800 p-8 rounded-[2.5rem] flex flex-col items-center gap-4 border border-gray-700 active:scale-95 transition shadow-2xl">
                <i class="fa-solid fa-gear text-3xl text-blue-400"></i>
                <span class="text-[10px] font-black uppercase tracking-widest">Admin</span>
            </a>
            <a href="kitchen.html" class="bg-gray-800 p-8 rounded-[2.5rem] flex flex-col items-center gap-4 border border-gray-700 active:scale-95 transition shadow-2xl">
                <i class="fa-solid fa-fire text-3xl text-orange-500"></i>
                <span class="text-[10px] font-black uppercase tracking-widest">Kitchen</span>
            </a>
            <a href="delivery.html" class="bg-gray-800 p-8 rounded-[2.5rem] flex flex-col items-center gap-4 border border-gray-700 active:scale-95 transition shadow-2xl">
                <i class="fa-solid fa-user-check text-3xl text-green-400"></i>
                <span class="text-[10px] font-black uppercase tracking-widest">Delivery</span>
            </a>
            <a href="reports.html" class="bg-gray-800 p-8 rounded-[2.5rem] flex flex-col items-center gap-4 border border-gray-700 active:scale-95 transition shadow-2xl">
                <i class="fa-solid fa-chart-line text-3xl text-purple-400"></i>
                <span class="text-[10px] font-black uppercase tracking-widest">Reports</span>
            </a>
        </div>
        <div class="text-center pt-4">
            <a href="index.html" class="text-xs text-gray-500 underline font-bold uppercase">Back to Public Menu</a>
        </div>
    </div>
</body>
</html>
